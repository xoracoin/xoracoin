*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:var(--txt);background:#0b1030}
body{background:#0b1030}
#bgl{position:fixed;inset:-24px;z-index:-1;background:var(--bg);filter:blur(var(--blur,2px))}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit;color:#fff;user-select:text}
input::placeholder{color:rgba(255,255,255,.5)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* LOADER */
#loader{position:fixed;inset:0;z-index:999;background:#0b1030;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;overflow:hidden}
#loader::before{content:'';position:absolute;inset:-24px;background:var(--bg);filter:blur(var(--blur,2px))}
#loader>*{position:relative;z-index:1}
#loader.hide{opacity:0;pointer-events:none}
#loader .ring{width:200px;height:200px;display:flex;align-items:center;justify-content:center}
#loader h1{font-size:40px;letter-spacing:4px;white-space:nowrap;margin:26px 0 4px;text-shadow:0 4px 8px rgba(0,0,0,.6)}
#loader .sub{letter-spacing:6px;font-weight:700;font-size:14px;text-shadow:0 2px 4px #000;text-align:center}
#loader .sub i{color:var(--gold);font-style:normal;margin:0 6px}
.bar{width:78%;max-width:420px;height:26px;border-radius:20px;border:2px solid #cfd8cf;background:rgba(10,20,40,.6);margin-top:34px;overflow:hidden}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#d99a00,#ffe27a);transition:width .1s linear}
#pct{font-size:30px;font-weight:900;margin-top:16px;text-shadow:0 2px 6px #000}
/* LANG SCREEN */
#langscr{position:fixed;inset:0;z-index:500;background:rgba(5,8,30,.55);backdrop-filter:blur(6px);display:none;flex-direction:column;justify-content:center;padding:24px}
#langscr.on{display:flex}
#langscr h3{text-align:center;font-size:17px;margin:0 0 22px;text-shadow:0 2px 6px #000}
.lbtn{display:flex;align-items:center;gap:18px;width:100%;padding:22px 24px;margin-bottom:16px;border-radius:34px;border:2px solid var(--line);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);font-size:26px;font-weight:900;text-shadow:0 2px 4px #000}
.lbtn span{font-size:40px}
#subscr{position:fixed;inset:0;z-index:500;background:rgba(5,8,30,.7);backdrop-filter:blur(8px);display:none;flex-direction:column;justify-content:center;padding:24px}
#subscr.on{display:flex}
.tgl{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;margin-bottom:12px;border-radius:26px;border:1.5px solid var(--line);background:rgba(255,255,255,.1);font-size:20px;font-weight:800}
.tgl.on{border-color:#7be39a;background:rgba(120,230,150,.18)}
.tgl span{font-size:34px}
#loader::before{display:none!important}
#loader{background:#0a0a0a}
html{background:#0a0803}
body{background:transparent!important;--glass:rgba(16,12,5,.72);--line:rgba(255,200,70,.26)}
.pill{background:rgba(20,15,4,.75)}
.seg{background:rgba(20,15,5,.7)!important;border-color:rgba(255,200,70,.22)}
.seg button.on{background:#e8b64a!important;color:#2a1d00;border-color:transparent!important;text-shadow:none}
#nav{background:rgba(22,16,6,.94)!important;border:1.2px solid rgba(200,150,40,.5);box-shadow:none!important;border-radius:28px;backdrop-filter:blur(6px)}
#nav button{color:#aab0bd;border:0!important;background:none!important;box-shadow:none!important;font-size:11px;letter-spacing:.6px}
#nav button.on{color:#e8b64a!important}
#nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.aimg{width:84px;height:84px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.aimg img{width:100%;height:100%;object-fit:cover}
.gobtn{width:46px;height:46px;border-radius:50%;background:#e8b64a;color:#2a1d00;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900;text-shadow:none}
/* HEADER */
#hdr{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.lvl{width:44px;height:44px;border-radius:50%;background:#2c88b5;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid rgba(255,255,255,.5);flex:none}
.who{flex:1;min-width:0;text-shadow:0 1px 4px #000}
.who small{display:block;letter-spacing:2px;font-size:11px;opacity:.9}.who small b{color:#5be08a}
.who div{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,50,100,.55);border:1.5px solid var(--line);border-radius:22px;padding:6px 10px;font-weight:900;font-size:15px}
.plus{width:24px;height:24px;border-radius:50%;background:var(--gold);color:#000;border:0;font-weight:900;line-height:1}
.dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#f2b100);display:inline-block}
#view{flex:1;overflow-y:auto;padding:6px 12px 130px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
/* NAV */
#nav{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;padding:8px 6px;border-radius:34px;background:rgba(8,12,36,.88);box-shadow:0 0 0 3px #ff7aa8, 0 0 0 5px #6ad4ff;backdrop-filter:blur(8px);z-index:10}
#nav button{flex:1;background:none;border:2px solid transparent;border-radius:24px;padding:8px 2px;font-size:10px;font-weight:800;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.9}
#nav button span{font-size:24px;line-height:1}
#nav button.on{background:rgba(245,194,43,.18);border-color:rgba(245,194,43,.7);color:var(--gold);box-shadow:0 0 14px rgba(245,194,43,.4)}
/* COMMON */
.card{background:var(--glass);border:1.5px solid var(--line);border-radius:26px;padding:14px;margin:10px 0;backdrop-filter:blur(6px);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.grow{flex:1;min-width:0}
.t1{font-weight:800;font-size:18px}.t2{font-size:14px;opacity:.9}
.seg{display:flex;background:rgba(20,50,100,.45);border:1.5px solid var(--line);border-radius:24px;padding:6px;margin:10px 0;gap:4px}
.seg button{flex:1;background:none;border:2px solid transparent;border-radius:18px;padding:12px 4px;font-weight:900;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 1px 3px #000}
.seg button.on{border-color:#fff;background:rgba(255,255,255,.12)}
.btn{background:linear-gradient(#f7cf3d,#e0a90f);color:#2a1d00;border:0;border-radius:30px;padding:14px;font-weight:900;font-size:16px;letter-spacing:.5px;width:100%;text-shadow:none;box-shadow:0 5px 14px rgba(0,0,0,.35)}
.btn.sm{width:auto;padding:12px 20px}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.5}
.btn.out{background:transparent;color:#fff;border:2px solid var(--gold);box-shadow:none;border-radius:26px}
.lab{font-size:13px;letter-spacing:2.5px;font-weight:800;margin:16px 4px 8px;text-shadow:0 1px 3px #000}
.inp{width:100%;background:rgba(10,20,50,.45);border:1.5px solid var(--line);border-radius:22px;padding:16px;font-size:20px;outline:0;min-width:0}
.inp:focus{border-color:#fff}
.ro{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.cp{width:62px;height:58px;flex:none;border-radius:20px;border:1.5px solid var(--line);background:rgba(255,255,255,.1);font-size:26px;color:var(--gold)}
.chev{font-size:26px;opacity:.7}
.ph{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.back{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.1);font-size:24px;flex:none}
.pt{margin-left:auto;font-weight:900;font-size:24px;text-shadow:0 2px 6px #000;text-align:right}
.pill2{border:1.5px solid var(--line);background:rgba(255,255,255,.12);border-radius:30px;padding:14px 18px;font-weight:900;font-size:16px;letter-spacing:1px}
/* HOME */
#bigc{display:flex;align-items:center;justify-content:center;gap:12px;font-size:min(52px,7.5vw);font-weight:900;margin-top:4px;text-shadow:0 4px 8px rgba(0,0,0,.45)}
#bigc .dot{width:42px;height:42px;border:4px solid #d9a000}
#coinwrap{display:flex;justify-content:center;position:relative;margin-top:10px;touch-action:none}
#coin{width:min(78vw,360px);height:min(78vw,360px);transition:transform .08s;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
#coin *{pointer-events:none}
#coin.p{transform:scale(.95)}
#shopbtn{background:linear-gradient(#f4cf4a,#d9a61a);border:0;border-radius:26px;padding:14px 24px;font-weight:900;font-size:20px;color:#2a1d00;box-shadow:0 4px 10px rgba(0,0,0,.4);text-shadow:none}
.shoprow{display:flex;justify-content:flex-end;margin:clamp(36px,7vh,72px) 2px 4px}
.cname{text-align:center;font-size:28px;font-weight:900;color:#ffd24a;margin:6px 0 12px;text-shadow:0 3px 6px #000;letter-spacing:.5px}
.en{border-radius:34px;padding:16px 18px}
.en .top{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:2px;font-size:20px}
.en .top b{background:rgba(0,0,0,.4);border:1.5px solid var(--line);border-radius:20px;padding:6px 18px;letter-spacing:3px}
.en .bt{height:30px;border-radius:20px;border:3px solid #dfe5d8;margin-top:14px;background:rgba(0,0,0,.35);overflow:hidden;padding:2px}
.en .bt>div{height:100%;background:linear-gradient(#ffe36a,#e3a700);border-radius:20px;transition:width .15s}
.fl{position:fixed;font-weight:900;font-size:34px;color:#fff;pointer-events:none;text-shadow:0 2px 6px #000;animation:fly .8s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translateY(-90px);opacity:0}}
/* MODAL */
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);display:none;align-items:flex-end}
#modal.on{display:flex}
.sheet{width:100%;max-height:92vh;overflow-y:auto;background:rgba(20,30,70,.7);border:1.5px solid var(--line);border-bottom:0;border-radius:36px 36px 0 0;padding:20px 16px 30px;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:none;border:0;font-size:34px;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.skin{border:1.5px solid var(--line);border-radius:30px;padding:12px;background:rgba(255,255,255,.07);position:relative}
.skin.sel{border-color:var(--gold);border-width:3px}
.skin .im{background:linear-gradient(#e3b92a,#c99c10);border-radius:24px;padding:12px;display:flex;justify-content:center;position:relative;border:1.5px solid rgba(255,255,255,.25)}
.skin .pr{position:absolute;top:8px;right:8px;background:rgba(20,50,80,.85);border:1.5px solid var(--line);border-radius:18px;padding:4px 10px;font-weight:900;color:#5bb8ff;font-size:15px;z-index:2}
.skin .tag{position:absolute;top:8px;left:8px;background:var(--gold);color:#000;border-radius:16px;padding:4px 10px;font-weight:900;font-size:13px;z-index:2}
.skin h4{margin:10px 2px 2px;font-size:20px}.skin p{margin:0 2px 10px;opacity:.85;font-size:14px}
.opt{border:1.5px solid var(--line);border-radius:26px;padding:16px;text-align:center;background:rgba(255,255,255,.07);font-weight:900;font-size:26px}
.opt small{display:block;color:#5bb8ff;font-size:24px;margin-top:6px}
.opt.on{border-color:var(--gold);background:rgba(245,194,43,.15)}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(0,0,0,.88);padding:12px 20px;border-radius:20px;z-index:700;font-weight:700;display:none;max-width:90%;text-align:center}
#wheel{transition:transform 4s cubic-bezier(.12,.7,.1,1)}
.diam{color:#5bb8ff;font-weight:900}
.mini{font-size:13px;opacity:.85}
/* RATING */
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:34px 0 14px}
.pc{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.av{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;border:4px solid;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.pc.first .av{width:98px;height:98px;font-size:42px}
.crown{font-size:38px;margin-bottom:-10px;z-index:2}
.pn{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;margin-top:8px;text-shadow:0 1px 3px #000}
.pv{background:rgba(255,255,255,.16);border-radius:16px;padding:4px 10px;font-weight:800;margin-top:6px;font-size:15px;white-space:nowrap}
.blk{width:100%;border:1.5px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;background:rgba(255,255,255,.12);display:flex;justify-content:center;padding-top:8px;font-size:38px;font-weight:900;margin-top:10px}
.rk{width:52px;height:52px;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
/* RECEIPT */
#rcpt{position:fixed;inset:0;z-index:600;background:radial-gradient(circle at 50% 0,#2b2105,#0b0905 55%);display:none;flex-direction:column;align-items:center;padding:16px 20px;overflow-y:auto}
#rcpt.on{display:flex}
.rtop{width:100%;display:flex;justify-content:space-between}
.rtop button{background:rgba(255,255,255,.08);border:0;border-radius:24px;padding:12px 18px;font-weight:700;font-size:17px}
.rchk{width:130px;height:130px;border-radius:50%;background:rgba(245,194,43,.14);display:flex;align-items:center;justify-content:center;margin-top:34px;box-shadow:0 0 0 22px rgba(245,194,43,.07)}
.rchk i{width:84px;height:84px;border:5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:44px;color:var(--gold)}
.rh{color:var(--gold);font-size:30px;font-weight:900;margin:34px 0 8px;text-align:center}
.rs{letter-spacing:4px;font-size:13px;opacity:.7;text-align:center}
.rbox{width:100%;max-width:480px;margin-top:30px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.04);padding:24px 22px}
.rbox .tot{text-align:center;letter-spacing:4px;font-size:13px;opacity:.7}
.rbox .amt{text-align:center;color:var(--gold);font-size:56px;font-weight:900;margin:6px 0 16px}
.rl{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.08);gap:10px}
.rl span:first-child{letter-spacing:3px;font-size:12px;opacity:.7}
.rl b{font-size:17px;text-align:right}
.rgo{margin-top:26px;width:100%;max-width:480px;background:#f1c40f;color:#222;border:0;border-radius:34px;padding:22px;font-weight:900;letter-spacing:3px;font-size:16px}
.rfoot{margin:26px 0 20px;font-size:11px;letter-spacing:3px;opacity:.55;text-align:center}

body.gate #app{display:none}
#langscr,#subscr,#welcome{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 96px;background:rgba(6,20,25,.22);backdrop-filter:none}
#langscr.on,#subscr.on,#welcome.on{display:flex}
#subscr{padding-bottom:20px;overflow-y:auto}
.tbar{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:20px;padding:6px 0 14px;text-shadow:0 2px 6px #000}
.tic{width:34px;height:34px;border-radius:10px;background:linear-gradient(#3b82f6,#1d4fb8);display:flex;align-items:center;justify-content:center;font-size:18px}
.gl{background:rgba(22,38,38,.58);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:16px;backdrop-filter:blur(8px);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.lbox,.wbox{flex:1;overflow-y:auto}
.gt{font-size:22px;font-weight:900;text-align:center}
.gs{font-size:15px;opacity:.8;text-align:center;margin:6px 0 14px;line-height:1.45}
.lrow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;margin-bottom:6px;font-size:19px;cursor:pointer}
.lrow.on{background:#1a2a55}
.lrow .fl2{font-size:30px}.lrow b{flex:1}
.rd{width:26px;height:26px;border-radius:50%;background:#fff}.lrow.on .rd{background:#e0b040}
.gbtn{display:block;width:100%;border:0;border-radius:26px;padding:18px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(#3b82f6,#1d4fb8);box-shadow:0 4px 14px rgba(0,0,0,.35);text-shadow:none}
.gbtn.fix{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:auto}
.wbox{display:flex;flex-direction:column;align-items:center;justify-content:center}
.wic{width:120px;height:120px;border-radius:32px;background:linear-gradient(#3b82f6,#1d4fb8);display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:18px}
.lockic{width:62px;height:62px;border-radius:18px;background:rgba(224,176,64,.25);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 8px}
.srow{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.3);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.srow img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.srow b{flex:1;font-size:18px;word-break:break-all}
.gb2{border:0;border-radius:12px;padding:12px 14px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(#3b82f6,#1d4fb8)}
.warn{display:none;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.45);color:#ff8fa3;font-weight:800;border-radius:16px;padding:12px;margin-bottom:12px;font-size:16px}
.dot{background:var(--coinimg) center/cover no-repeat!important;border:0!important;box-shadow:none!important}
</style>

function makeCode(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='';
  if(TU&&TU.id){ let n=Number(TU.id)%Math.pow(32,5); for(let i=0;i<5;i++){out=ch[n%32]+out;n=Math.floor(n/32)} }
  else for(let i=0;i<5;i++) out+=ch[Math.floor(Math.random()*32)];
  return out;
}

function applyConf(c){
  if(!c||typeof c!=='object') return;
  try{
    if(c.cfg) CONF_KEYS.forEach(k=>{ const v=c.cfg[k]; if(v===undefined||v===null) return;
      if(typeof CFG[k]==='number'){ if(v==='')return; const n=Number(v); if(!isNaN(n)) CFG[k]=n; } else CFG[k]=String(v); });
    if(c.skins&&typeof c.skins==='object'){
      for(let i=SKINS.length-1;i>=0;i--){ if(SKINS[i].custom&&!c.skins[SKINS[i].id]) SKINS.splice(i,1); }
      for(const id in c.skins){ const x=c.skins[id]; if(!x) continue;
        let k=SKINS.find(y=>y.id===id);
        if(!k){ if(!x.custom) continue; k={id,custom:true,f:'none'}; SKINS.push(k); }
        if(+x.price>=0)k.price=+x.price; if(+x.mult>=1)k.mult=+x.mult; if(+x.en>=1)k.en=+x.en; k.img=x.img?String(x.img):''; k.nm=x.nm?String(x.nm):''; }
    }
    if(c.rates) Object.values(SERVICES).flat().forEach(x=>{ if(c.rates[x.id]!==undefined&&+c.rates[x.id]>=0) x.rate=+c.rates[x.id]; });
    if(Array.isArray(c.wheel)){ const w=c.wheel.map(Number).filter(n=>n>0); if(w.length>=2){WHEEL.length=0;WHEEL.push(...w);} }
    if(c.codes&&typeof c.codes==='object'){ Object.keys(BONUS_CODES).forEach(k=>delete BONUS_CODES[k]); for(const k in c.codes){ BONUS_CODES[k.toUpperCase()]={c:+c.codes[k].c||0,d:+c.codes[k].d||0,exp:+c.codes[k].exp||0}; } }
    if(Array.isArray(c.auctions)){ AUC_CONF.length=0; c.auctions.forEach(a=>{ if(a&&a.id) AUC_CONF.push({id:String(a.id),title:String(a.title||''),seller:String(a.seller||''),start:+a.start||0,bidder:String(a.bidder||''),end:+a.end||Date.now(),img:String(a.img||''),desc:String(a.desc||'')}); }); }
    if(Array.isArray(c.skinsDel)){ SKDEL.length=0; c.skinsDel.forEach(id=>{ SKDEL.push(id); const i=SKINS.findIndex(x=>x.id===id&&id!=='basic'); if(i>=0)SKINS.splice(i,1); }); }
    if(Array.isArray(c.ads)){ ADS.length=0; c.ads.forEach((x,i)=>{ if(x&&x.url) ADS.push({id:String(x.id||('ad'+i)),url:String(x.url)}); }); }
    if(Array.isArray(c.admins)){ ADMX.length=0; c.admins.forEach(x=>ADMX.push(String(x))); }
    if(c.texts&&typeof c.texts==='object'){ for(const k in c.texts){ if(!D[k])continue; for(const i in c.texts[k]){ D[k][+i]=String(c.texts[k][i]); } TEXTS[k]=c.texts[k]; } }
    if(c.notice&&typeof c.notice==='object') Object.assign(NOTICE,c.notice);
    if(c.maint&&typeof c.maint==='object') Object.assign(MAINT,c.maint);
    if(Array.isArray(c.subs)){ SUBS.length=0; c.subs.forEach((x,i)=>{ if(x&&x.u) SUBS.push({id:String(x.id||('s'+i)),type:(x.type==='instagram'||x.type==='youtube')?x.type:'telegram',u:String(x.u)}); }); }
    if(Array.isArray(c.atasks)){ ATASKS.length=0; c.atasks.forEach(x=>{ if(x&&x.id&&x.u) ATASKS.push({id:String(x.id),u:String(x.u),reward:+x.reward||0}); }); }
    if(Array.isArray(c.gifts)){ GIFTS.length=0; c.gifts.forEach(g=>{ if(g&&g.id&&g.to) GIFTS.push({id:String(g.id),to:String(g.to),c:+g.c||0,d:+g.d||0}); }); }
    if(c.rating) ['dia','coin'].forEach(k=>{ if(Array.isArray(c.rating[k])) RATING[k]=c.rating[k].map(x=>({n:String(x.n),v:+x.v||0})).filter(x=>!/^@namuna_/i.test(x.n)); });
  }catch(e){}
}

/* ================= BARABAN ================= */
let rot=0,spinning=false;
function wheelSVG(){
  const n=WHEEL.length,R=170,cx=180,cy=180;let p='';
  for(let i=0;i<n;i++){
    const a0=(i*360/n-90)*Math.PI/180,a1=((i+1)*360/n-90)*Math.PI/180,am=(a0+a1)/2;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const tx=cx+R*.68*Math.cos(am),ty=cy+R*.68*Math.sin(am),deg=am*180/Math.PI+90;
    p+=`<path d="M${cx} ${cy}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${WCOL[i%WCOL.length]}" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <text transform="translate(${tx} ${ty}) rotate(${deg})" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" stroke="#0003" stroke-width="1">${fmt(WHEEL[i])}💎</text>`;
  }
  return `<div style="position:relative;width:100%;max-width:360px;margin:0 auto"><div style="position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:6px;height:40px;background:linear-gradient(#ffe27a,#fff0);border-radius:4px;z-index:3"></div>
  <svg id="wheel" viewBox="0 0 360 360" style="transform:rotate(${rot}deg);width:100%;display:block;border-radius:50%;border:8px solid rgba(255,255,255,.35)">${p}</svg>
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;backdrop-filter:blur(4px)">Xora</div></div>`;
}
function wheelModal(){
  modal(t('wheelT'),`${wheelSVG()}<div class="row" style="justify-content:center;margin:22px 0 12px"><span class="dot"></span><span style="font-size:20px">${t('spinCost',{n:fmt(CFG.SPIN_COST)})}</span></div><button class="btn ghost" data-act="spin" style="font-size:24px;letter-spacing:3px">${t('spin')}</button>`);
}
function spin(){
  if(spinning)return;
  if(S.c<CFG.SPIN_COST){toast(t('noCoin'));return}
  S.c-=CFG.SPIN_COST;hdr();spinning=true;
  const w=WHEEL.map(v=>v>=500?1:20),tot=w.reduce((a,b)=>a+b);let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++}
  const center=i*(360/WHEEL.length)+180/WHEEL.length;
  const cur=((rot%360)+360)%360;
  rot+=((360-center)-cur+360)%360+360*6;
  const wh=$('#wheel'); if(wh) wh.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{spinning=false;S.d+=WHEEL[i];save();hdr();toast(t('won',{n:WHEEL[i]}))},4100);
}

function admSet(path,val,el){
  const [g,a,b]=path.split('.');
  if(g==='cfg'){ CFG[a]=typeof CFG[a]==='number'?(parseFloat(val)||0):val.trim(); applyBg(); }
  else if(g==='skin'){ const k=SKINS.find(x=>x.id===a); if(!k)return; if(b==='img')k.img=val.trim(); else if(b==='nm')k.nm=val.trim(); else k[b]=Math.max(b==='price'?0:1,parseFloat(val)||0); S.energy=Math.min(S.energy,CFG.ENERGY_MAX); }
  else if(g==='rate'){ const x=Object.values(SERVICES).flat().find(y=>y.id===a); if(x)x.rate=Math.max(0,parseFloat(val)||0); }
  else if(g==='wheel'){ const w=val.split(/[,\s]+/).map(Number).filter(n=>n>0); if(w.length<2){toast('Kamida 2 ta son kiriting');return} WHEEL.length=0;WHEEL.push(...w); }
  else if(g==='rating'){ RATING[a]=val.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf(',');const n=(i>0?l.slice(0,i):l).trim();return {n:n.startsWith('@')?n:'@'+n,v:i>0?(parseFloat(l.slice(i+1))||0):0}}); }
  else if(g==='auc'){ const c=AUC_CONF.find(x=>x.id===a); if(!c)return;
    if(b==='title'||b==='seller'||b==='img'||b==='desc')c[b]=val.trim();
    else if(b==='start')c.start=parseInt(val)||0;
    else if(b==='hours'){ if(val==='')return; c.end=Date.now()+(parseFloat(val)||0)*3600e3; delete c.hours; }
    syncAucs(); }
  else if(g==='code'){ const r=BONUS_CODES[a]; if(!r)return; r[b]=parseInt(val)||0; }
  else if(g==='txt'){ const i=+b; if(D[a]){ D[a][i]=val; (TEXTS[a]=TEXTS[a]||{})[i]=val; } }
  else if(g==='notice'){ NOTICE[a]=(a==='on')?val==='1':val; if(a==='text')NOTICE.id=Date.now(); afterConf(); }
  else if(g==='maint'){ MAINT[a]=(a==='on')?val==='1':val; afterConf(); }
  else if(g==='acct'){ S[a]=Math.max(0,Math.floor(parseFloat(val)||0)); hdr(); }
  persistAdmin(); save(); toast('Saqlandi ✓');
}

document.addEventListener('change',e=>{
  if(e.target.id!=='na_f'||!e.target.files[0])return;

  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);aucNewImg=c.toDataURL('image/jpeg',.8);const o=$('#na_ok');if(o)o.textContent='✓ Rasm tanlandi'};im.src=r.result};
  r.readAsDataURL(e.target.files[0]);
});

function musicSync(){

}

function fillLoader(){const e=$('#lsub');if(e)e.innerHTML=`${t('ld1')}<i>◆</i>${t('ld2')}<i>◆</i>${t('ld3')}`}
(function loader(){
  fillLoader();
  $('#lcoin').innerHTML=coin(SKINS[0],200);
  const t0=performance.now(),Dm=3000;
  (function step(now){
    const p=Math.min(100,Math.floor((now-t0)/Dm*100));
    $('#lbar').style.width=p+'%';$('#pct').textContent=p+'%';
    if(p<100) requestAnimationFrame(step);
    else setTimeout(()=>{$('#loader').classList.add('hide');setTimeout(()=>$('#loader').remove(),600)},250);
  })(t0);
})();

function api(path,body){return fetch(CFG.API.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:(tg&&tg.initData)||''},body||{}))}).then(r=>r.json())}
async function syncMe(){
  if(!CFG.API)return;
  try{
    if(S.refBy&&!S.refSent){await api('/referral',{ref:S.refBy});S.refSent=true}
    const j=await api('/me',{code:S.code});
    if(j&&j.ok){
      if(j.d>0){S.d+=j.d;toast('+'+j.d+' 💎',3000)}
      if(Array.isArray(j.friends))S.friends=j.friends;
      save();hdr();
      if(j.incoming&&j.incoming.length){const x=j.incoming[j.incoming.length-1];showReceipt({t:x.t,amt:x.amt,to:myName.replace('@',''),from:x.from,id:x.id})}
      if(page==='invites')render();
    }
  }catch(e){}
}
function loadFriends(){syncMe()}

  S.refDone=true;S.refBy=sp;S.d+=CFG.FRIEND_REWARD;save();
})();

const SUBIC={telegram:IC_TG,instagram:IC_IG,youtube:IC_YT};
function subUrl(s){const u=String(s.u||'').trim();if(/^https?:\/\//.test(u))return u;const n=u.replace(/^@/,'');return s.type==='instagram'?'https://instagram.com/'+n:s.type==='youtube'?'https://youtube.com/@'+n:'https://t.me/'+n}
function subName(s){return '@'+String(s.u||'').replace(/^https?:\/\/(www\.)?(t\.me|instagram\.com|youtube\.com)\//,'').replace(/^@/,'').replace(/\/$/,'')}
const tbar=()=>`<div class="tbar"><span class="tic">⚡</span>XORA COIN</div>`;
const hideGate=()=>['langscr','welcome','subscr'].forEach(i=>$('#'+i).classList.remove('on'));
const subsOk=()=>{S.sc=S.sc||{};return SUBS.filter(s=>s.type==='telegram').every(s=>S.sc[s.id])};
function showLang(){hideGate();const e=$('#langscr');
  e.innerHTML=`${tbar()}<div class="gl lbox"><div class="gt">${t('chLang')}</div><div class="gs">${t('chLangD')}</div>${LANGS.map(x=>`<div class="lrow ${S.lang===x[0]?'on':''}" data-act="pickl" data-v="${x[0]}"><span class="fl2">${x[1]}</span><b>${x[2]}</b><i class="rd"></i></div>`).join('')}</div><button class="gbtn fix" data-act="langgo">${t('contin')} →</button>`;
  e.classList.add('on')}
function showWelcome(){hideGate();const e=$('#welcome');
  e.innerHTML=`${tbar()}<div class="gl wbox"><div class="wic">🐷</div><div class="gt">${t('wlc')}</div><div class="gs">${t('wlcD')}</div></div><button class="gbtn fix" data-act="wgo">${t('startB')} →</button>`;
  e.classList.add('on')}
function showSub(){hideGate();const e=$('#subscr');
  e.innerHTML=`${tbar()}<div class="gl"><div class="warn" id="subwarn">⚠ ${t('subFirstAll')}</div><div class="lockic">🔒</div><div class="gt">${t('subT')}</div><div class="gs">${t('subD2')}</div>${SUBS.map(s=>`<div class="srow"><img src="${SUBIC[s.type]}" alt=""><b>${esc(subName(s))}</b><button class="gb2" data-act="subgo" data-id="${esc(s.id)}">${t('goCh')}</button></div>`).join('')}<button class="gbtn" style="margin-top:12px" data-act="subchk">${t('check')}</button></div>`;
  e.classList.add('on')}
function subWarn(){const w=$('#subwarn');if(!w)return;w.style.display='flex';clearTimeout(subWarn.t);subWarn.t=setTimeout(()=>{w.style.display='none'},5000)}
function subSkip(){}
function subPass(){S.subOk=true;S.done.main=true;delete S.pending.main;save();openApp()}
function openApp(){document.body.classList.remove('gate');hideGate();renderNav();render();claimGifts();afterConf()}
function gate(){document.body.classList.add('gate');
  if(!S.langSet)return showLang();
  if(!S.welcomed)return showWelcome();
  if(!SUBS.length)return openApp();
  if(CFG.API){api('/checksub',{channels:SUBS.filter(s=>s.type==='telegram').map(s=>String(s.u).replace(/^@/,''))}).then(j=>{if(j&&j.ok)subPass();else showSub()}).catch(showSub);return}
  if(S.subOk&&subsOk())return openApp();
  showSub()}
function genId(){return Array.from({length:10},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('')}
function claimGifts(){
  if(document.body.classList.contains('gate'))return; S.gifts=S.gifts||{};
  const me=[S.code,myName.slice(1)].map(x=>String(x).toLowerCase()); let big=null;
  GIFTS.forEach(g=>{ if(S.gifts[g.id]||!me.includes(g.to.replace(/^@/,'').toLowerCase()))return;
    S.gifts[g.id]=1; S.c=Math.max(0,S.c+g.c); S.d=Math.max(0,S.d+g.d);
    if(g.d>0)big=g; else if(g.c) toast((g.c>0?'+':'')+fmt(g.c)+' coin',3000); });
  save();hdr(); if(big) showReceipt({t:Date.now(),amt:big.d,to:myName.replace('@',''),from:'admin',id:genId()});
}
Object.assign(A,{
  pickl(d){S.lang=d.v;document.documentElement.dir=d.v==='ar'?'rtl':'ltr';showLang()},
  langgo(){S.langSet=true;save();fillLoader();gate()},

  async subchk(){
    const tgs=SUBS.filter(s=>s.type==='telegram');

    if(subsOk())subPass(); else subWarn();
  },

/* ===== REKLAMA: tasodifiy havola, 15 soniya ko'rilsa 1 olmos ===== */
let AD_RUN=null,AD_TM=null;
const adSecs=()=>Number(CFG.AD_SECS)||15;
function adOverlay(h){let o=$('#adov');if(!o){o=document.createElement('div');o.id='adov';o.style.cssText='position:fixed;inset:0;z-index:800;background:rgba(5,8,30,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px';document.body.appendChild(o)}o.innerHTML=h}
function adClose(){clearInterval(AD_TM);AD_RUN=null;const o=$('#adov');if(o)o.remove()}
function adFail(){adClose();toast(t('adFail'),3500)}
function adWin(){const n=AD_RUN.n;S.adT=S.adT||{};S.adT[n]=Date.now()+((n===1?CFG.AD1_CD:CFG.AD2_CD)||2)*60000;S.d+=CFG.AD_REWARD;S.adsN=(S.adsN||0)+1;save();adClose();hdr();render();toast(t('rewarded',{n:CFG.AD_REWARD}))}
function adTick(){if(!AD_RUN)return;const left=Math.ceil(adSecs()-(Date.now()-AD_RUN.t0)/1000);if(left<=0){adWin();return}const e=$('#adn');if(e)e.textContent=left}
document.addEventListener('visibilitychange',()=>{if(!AD_RUN)return;if(document.hidden){AD_RUN.away=true;return}
  if(AD_RUN.away){ if(Date.now()-AD_RUN.t0>=adSecs()*1000)adWin(); else adFail(); }});
Object.assign(A,{
  ad(d){const n=+d.n;S.adT=S.adT||{};if(S.adT[n]&&Date.now()<S.adT[n])return;
    const pool=ADS.map(x=>x.url).concat([CFG.AD1_URL,CFG.AD2_URL]).filter(Boolean);
    if(!pool.length){toast(t('adNo'));return}
    const u=pool[Math.floor(Math.random()*pool.length)];
    AD_RUN={n,t0:Date.now()};
    adOverlay(`<div style="font-size:54px">📺</div><div style="font-size:19px;font-weight:800">${t('adWait')}</div><div id="adn" style="font-size:72px;font-weight:900;color:#f5c22b">${adSecs()}</div><div style="font-size:16px;opacity:.8">+${CFG.AD_REWARD} 💎</div><button class="btn out" style="width:auto;padding:12px 26px" data-act="adx">${t('adCancel')}</button>`);
    clearInterval(AD_TM);AD_TM=setInterval(adTick,250);openLink(u)},

});

document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.dr;if(!f||!SKD)return;SKD[f]=e.target.value;if(!SKD.dirty){SKD.dirty=true;const b=$('#sksv');if(b)b.style.display=''}});
document.addEventListener('change',e=>{
  const fl=e.target.files&&e.target.files[0]; if(!fl)return;
  if(e.target.id!=='skdf'&&e.target.id!=='bgf')return;
  const isBg=e.target.id==='bgf', max=isBg?900:320;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',isBg?.7:.85);
    if(isBg){CFG.BG_URL=url;applyBg();persistAdmin();save();render();toast('Fon qo\'yildi ✓')}
    else if(SKD){SKD.img=url;SKD.dirty=true;render()}};im.src=fr.result};
  fr.readAsDataURL(fl);
});
